name: Build Kastrava releases
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:prod
      - run: npx electron-builder --win nsis portable
      - uses: actions/upload-artifact@v4
        with:
          name: Kastrava-win
          path: |
            release/Kastrava-Setup-*.exe
            release/Kastrava-*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y fakeroot rpm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:prod
      - run: npx electron-builder --linux deb rpm
      - uses: actions/upload-artifact@v4
        with:
          name: Kastrava-linux
          path: |
            release/*.deb
            release/*.rpm
          if-no-files-found: error
