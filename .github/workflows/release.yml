# Canonical multi-platform release builder. Triggered by v* tags (builds e.g.
# v101.0.0) and manually. Stamps the production API/store hosts into the
# bundle, builds the Windows installers + Linux packages on native runners,
# then publishes all artifacts to a GitHub Release for the tag.
name: Build Kastrava releases

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build premium bundle (stamped with live API/store hosts)
        run: npm run build:prod
        env:
          KAS_API: https://nexufog.pp.ua
          KAS_STORE: https://kastrava.pp.ua
      - name: Package Windows installers (unsigned)
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Generate self-signed cert for MSIX (Store re-signs at ingestion)
        shell: pwsh
        run: |
          $cwd = ConvertTo-SecureString -String "kasbuild" -Force -AsPlainText
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Kastrava" -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -FriendlyName "Kastrava MSIX" -CertStoreLocation "Cert:\CurrentUser\My" -KeyExportPolicy Exportable
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\kastrava.pfx" -Password $cwd | Out-Null
          Write-Host "self-signed code-signing cert exported"
      - name: Package MSIX (store-ready)
        shell: pwsh
        run: |
          $env:CSC_LINK = "$env:RUNNER_TEMP\kastrava.pfx"
          $env:CSC_KEY_PASSWORD = "kasbuild"
          npx electron-builder --win appx --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Kastrava-win
          path: |
            release/Kastrava-Setup-*.exe
            release/Kastrava-*.exe
            release/*.msix
            release/*.appx
            release/latest.yml
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y fakeroot rpm zstd libarchive-tools
      - run: npm ci --no-audit --no-fund
      - name: Build premium bundle (stamped with live API/store hosts)
        run: npm run build:prod
        env:
          KAS_API: https://nexufog.pp.ua
          KAS_STORE: https://kastrava.pp.ua
      - name: Package Linux (deb / rpm / AppImage / pacman)
        run: npx electron-builder --linux deb rpm AppImage pacman --x64 --publish never
      - name: Convert pacman artifact to .pkg.tar.zst (site filename)
        run: |
          v=$(node -p "require('./package.json').version")
          if ls release/*.pacman >/dev/null 2>&1; then
            xz -dc release/*.pacman | zstd -3 -o "release/kastrava-${v}-1-x86_64.pkg.tar.zst"
          fi
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: Kastrava-linux
          path: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/kastrava-*.pkg.tar.zst
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest runners ship the Android SDK preinstalled
      # (ANDROID_HOME + accepted licenses); no setup action needed.
      - name: Install Gradle 8.9
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK to release filename
        run: |
          v=$(node -p "require('../package.json').version")
          cp app/build/outputs/apk/debug/app-debug.apk "Kastrava-${v}.apk"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: Kastrava-android
          path: android/Kastrava-*.apk
          if-no-files-found: error

  publish:
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: Kastrava ${{ github.ref_name }}
          files: |
            artifacts/Kastrava-win/*
            artifacts/Kastrava-linux/*
            artifacts/Kastrava-android/*