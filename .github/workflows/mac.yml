name: Build macOS DMG
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx electron-builder --mac dmg
      - uses: actions/upload-artifact@v4
        with:
          name: AnterSurf-mac-dmg
          path: dist/*.dmg
