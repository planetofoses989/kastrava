# Builds the Kastrava Windows installers on a windows-latest runner and drops
# them into a GitHub Release for tagged builds (v...) so the site can link
# them. The app bundle is stamped with the production API/store hosts and the
# premium edition before packaging.
name: Build Windows installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron tooling
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package.json') }}

      - run: npm ci

      - name: Build premium bundle (stamped with live API/store hosts)
        run: node scripts/build-editions.js premium
        env:
          KAS_API: https://nexufog.pp.ua
          KAS_STORE: https://kastrava.pp.ua

      - name: Package Windows installers (unsigned)
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            release/Kastrava-Setup-*.exe
            release/Kastrava-*.exe
            release/latest.yml
          if-no-files-found: error

      - name: Publish GitHub Release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Kastrava ${{ github.ref_name }}
          files: |
            release/Kastrava-Setup-*.exe
            release/Kastrava-*.exe