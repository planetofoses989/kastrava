<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https:; img-src * data:;">
<title>AnterSurf</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#8ab4f8;--c-bg:#1a1a2e;--c-toolbar:#16213e;--c-tab-active:#16213e;--c-omni:#0f3460;--c-text:#e8eaed;--c-text2:#8892a0;--c-border:#2a2a4a;--c-hover:rgba(255,255,255,.07);--c-surface:rgba(255,255,255,.04);--tb:38px;--toolbar-h:42px;--win-w:138px;--radius:10px;--radius-sm:6px}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI','Google Sans',system-ui,-apple-system,sans-serif;background:var(--c-bg);color:var(--c-text);font-size:12px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-user-select:none;user-select:none}
.app{display:flex;flex-direction:column;height:100%;overflow:hidden}
.titlebar{display:flex;align-items:stretch;height:var(--tb);background:var(--c-bg);flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.04);position:relative}
.drag-strip{position:absolute;top:0;left:0;right:0;height:4px;-webkit-app-region:drag;z-index:1}
.win-ctrls{display:flex;align-items:stretch;flex-shrink:0}
.win-btn{width:46px;height:100%;border:none;background:none;color:var(--c-text2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.win-btn svg{width:10px;height:10px}
.win-btn:hover{background:rgba(255,255,255,.08);color:var(--c-text)}
.win-btn.wc-close:hover{background:#e81123;color:#fff}
.tab-strip{display:flex;align-items:flex-end;flex:1;min-width:0;overflow:hidden;padding-left:4px;gap:1px}
#tab-list{display:flex;align-items:flex-end;min-width:0;flex:1;overflow-x:auto;overflow-y:hidden;gap:1px}
#tab-list::-webkit-scrollbar{height:0}
.new-tab-btn{width:28px;height:28px;border:none;background:none;color:var(--c-text2);cursor:pointer;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,color .15s;margin:4px 0 4px 4px}
.new-tab-btn:hover{background:var(--c-hover);color:var(--c-text)}
.new-tab-btn svg{width:14px;height:14px}
.tab-item{display:flex;align-items:center;gap:6px;padding:0 10px;height:30px;cursor:pointer;border-radius:var(--radius-sm) var(--radius-sm) 0 0;transition:background .15s;position:relative;min-width:50px;max-width:200px;flex-shrink:0;background:transparent;margin-top:auto}
.tab-item:hover{background:rgba(255,255,255,.05)}
.tab-item.active{background:var(--c-tab-active)}
.tab-item .tab-favicon{width:14px;height:14px;border-radius:3px;flex-shrink:0;object-fit:contain}
.tab-item .tab-favicon.placeholder{display:flex;align-items:center;justify-content:center;background:var(--c-border);border-radius:50%}
.tab-item .tab-favicon.placeholder svg{width:9px;height:9px;color:var(--c-text2)}
.tab-item .tab-title{flex:1;font-size:11px;font-weight:400;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none;opacity:.85}
.tab-item.active .tab-title{opacity:1;font-weight:500}
.tab-item .tab-close-btn{width:16px;height:16px;border:none;background:none;color:var(--c-text2);cursor:pointer;border-radius:50%;display:none;align-items:center;justify-content:center;flex-shrink:0;padding:0;transition:background .12s;margin-right:-2px}
.tab-item .tab-close-btn svg{width:8px;height:8px}
.tab-item:hover .tab-close-btn,.tab-item.active .tab-close-btn{display:flex}
.tab-item .tab-close-btn:hover{background:rgba(255,255,255,.12)}
.tab-item.pinned .tab-title{display:none}
.tab-item .tab-pin{font-size:8px;color:var(--c-text2);display:none}
.tab-item.pinned .tab-pin{display:block}
.tab-item .tab-audio{display:none;width:12px;height:12px;color:var(--c-text2);flex-shrink:0;cursor:pointer}
.tab-item.playing .tab-audio{display:block}
.tab-item.muted .tab-audio{color:#f28b82}
.tab-item .loading-indicator{position:absolute;bottom:0;left:10px;right:10px;height:2px;border-radius:1px;background:var(--accent);display:none}
.tab-item.loading .loading-indicator{display:block;animation:load-anim 1.5s ease-in-out infinite}
@keyframes load-anim{0%{width:0;left:10px}50%{width:80%;left:10px}100%{width:0;left:calc(100% - 10px)}}
.toolbar{display:flex;align-items:center;padding:0 8px;height:var(--toolbar-h);background:var(--c-toolbar);flex-shrink:0;gap:2px;border-bottom:1px solid rgba(255,255,255,.04)}
.tb-btn{width:30px;height:28px;border:none;background:none;color:var(--c-text2);cursor:pointer;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,color .15s}
.tb-btn svg{width:16px;height:16px}
.tb-btn:hover{background:var(--c-hover);color:var(--c-text)}
.tb-btn:disabled{opacity:.3;cursor:default}
.tb-btn:disabled:hover{background:none}
.tb-btn.on{color:var(--accent);background:rgba(138,180,248,.14)}
.tb-btn.on:hover{color:var(--accent);background:rgba(138,180,248,.2)}
.omnibox{flex:1;display:flex;align-items:center;background:var(--c-surface);border:1px solid transparent;border-radius:24px;padding:0 6px 0 12px;height:30px;min-width:0;transition:all .2s ease;margin:0 4px}
.omnibox:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.08)}
.omnibox:focus-within{background:rgba(255,255,255,.08);border-color:rgba(138,180,248,.3);box-shadow:0 0 0 1px rgba(138,180,248,.15)}
.omnibox .omni-icon{width:14px;height:14px;margin-right:8px;flex-shrink:0;color:var(--c-text2)}
.omnibox .omni-icon svg{width:13px;height:13px}
.omnibox .url-input{flex:1;background:none;border:none;outline:none;color:var(--c-text);font-size:13px;min-width:0;padding:0;font-family:inherit;-webkit-user-select:text;user-select:text}
.omnibox .url-input::placeholder{color:var(--c-text2)}
.omnibox .bm-star{width:22px;height:22px;border:none;background:none;color:var(--c-text2);cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:color .15s}
.omnibox .bm-star svg{width:14px;height:14px}
.omnibox .bm-star:hover{color:var(--c-text)}
.omnibox .bm-star.on{color:#fbbc04}
.tb-right{display:flex;align-items:center;gap:0;flex-shrink:0;margin-left:2px}
.tb-sep{width:1px;height:14px;background:var(--c-border);margin:0 2px;flex-shrink:0}
.content{flex:1;position:relative;overflow:hidden;background:var(--c-tab-active)}
.webview-wrap{position:absolute;inset:0;display:none}
.webview-wrap.visible{display:block}
.webview-wrap webview{position:absolute;inset:0;border:none;width:100%;height:100%}
.ntp{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding-top:80px;background:var(--c-tab-active);z-index:1;overflow-y:auto;-webkit-user-select:text;user-select:text}
.ntp.visible{display:flex}
.ntp-logo{width:64px;height:64px;margin-bottom:14px;border-radius:14px;opacity:.9;filter:drop-shadow(0 2px 8px rgba(0,0,0,.2))}
.ntp-time{font-size:48px;font-weight:200;color:rgba(232,234,237,.5);margin-bottom:24px;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.ntp-search{display:flex;align-items:center;background:var(--c-surface);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:0 8px 0 16px;width:100%;max-width:540px;height:46px;transition:all .2s ease}
.ntp-search:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}
.ntp-search:focus-within{background:rgba(255,255,255,.08);border-color:rgba(138,180,248,.3);box-shadow:0 0 0 1px rgba(138,180,248,.15)}
.ntp-search svg{width:18px;height:18px;color:var(--c-text2);flex-shrink:0;margin-right:12px}
.ntp-search input{flex:1;background:none;border:none;outline:none;color:var(--c-text);font-size:15px;font-family:inherit;-webkit-user-select:text;user-select:text}
.ntp-search input::placeholder{color:var(--c-text2)}
.ntp-shortcuts{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:24px;width:100%;max-width:620px;padding:0 16px}
.shortcut{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:var(--radius);cursor:pointer;color:var(--c-text2);transition:background .15s,color .15s}
.shortcut:hover{background:var(--c-hover);color:var(--c-text)}
.shortcut .sc-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;background:var(--c-surface);border:1px solid rgba(255,255,255,.06);transition:background .15s,border-color .15s}
.shortcut:hover .sc-icon{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.1)}
.shortcut .sc-label{font-size:11px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:72px}
.ntp-footer{position:fixed;bottom:8px;font-size:11px;color:rgba(232,234,237,.2);pointer-events:none;letter-spacing:.5px}
.ag-page{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;background:var(--c-tab-active);z-index:1;-webkit-user-select:text;user-select:text}
.ag-page.visible{display:flex}
.find-bar{display:none;align-items:center;gap:6px;padding:4px 12px;background:var(--c-toolbar);border-bottom:1px solid rgba(255,255,255,.04);flex-shrink:0}
.find-bar.visible{display:flex}
.find-bar input{flex:1;max-width:260px;padding:5px 10px;border-radius:var(--radius-sm);border:none;background:var(--c-surface);color:var(--c-text);font-size:12px;outline:none;-webkit-user-select:text;user-select:text}
.find-bar button{width:24px;height:24px;border:none;background:none;color:var(--c-text2);cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
.find-bar button:hover{background:var(--c-hover);color:var(--c-text)}
.find-bar button svg{width:12px;height:12px}
.bm-bar{display:none;align-items:center;gap:2px;padding:0 8px;height:30px;flex-shrink:0;background:var(--c-toolbar);overflow-x:auto;border-bottom:1px solid rgba(255,255,255,.04)}
.bm-bar.visible{display:flex}
.bm-bar::-webkit-scrollbar{height:0}
.bm-chip{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--radius-sm);font-size:12px;color:var(--c-text);cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s;background:var(--c-surface);border:1px solid transparent}
.bm-chip:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.08);color:var(--c-text)}
.bm-chip .bm-fav{width:14px;height:14px;border-radius:3px;flex-shrink:0}
.settings-page{position:fixed;inset:0;z-index:200;background:var(--c-bg);display:none;flex-direction:column}
.settings-page.visible{display:flex}
.settings-toolbar{display:flex;align-items:center;gap:12px;padding:0 12px;height:var(--toolbar-h);background:var(--c-toolbar);flex-shrink:0}
.settings-toolbar button{width:30px;height:30px;border:none;background:none;color:var(--c-text2);cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.settings-toolbar button:hover{background:var(--c-hover);color:var(--c-text)}
.settings-toolbar button svg{width:18px;height:18px}
.settings-body{display:flex;flex:1;overflow:hidden}
.settings-nav{width:220px;border-right:1px solid var(--c-border);padding:8px 0;overflow-y:auto;flex-shrink:0}
.sn-item{display:flex;align-items:center;gap:10px;padding:8px 20px;font-size:13px;color:var(--c-text2);cursor:pointer;transition:background .15s,color .15s;border-radius:0 20px 20px 0;margin-right:8px}
.sn-item:hover{background:var(--c-hover);color:var(--c-text)}
.sn-item.active{color:var(--accent);background:rgba(138,180,248,.08)}
.settings-main{flex:1;padding:28px 40px;overflow-y:auto;max-width:700px}
.settings-main h3{font-size:22px;font-weight:400;margin-bottom:24px;color:var(--c-text)}
.sg{margin-bottom:24px}
.sg .lbl{font-size:13px;color:var(--c-text);margin-bottom:6px;font-weight:500}
.sg .desc{font-size:12px;color:var(--c-text2);margin-top:3px;line-height:1.5}
.sg select,.sg input[type=text]{padding:7px 10px;border-radius:var(--radius-sm);border:1px solid var(--c-border);background:var(--c-omni);color:var(--c-text);font-size:13px;outline:none;width:100%;font-family:inherit;transition:border-color .15s}
.sg select:focus,.sg input[type=text]:focus{border-color:var(--accent)}
.btn-sm{padding:6px 14px;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;font-family:inherit;transition:background .15s}
.btn-danger{background:rgba(242,139,130,.15);color:#f28b82}
.btn-danger:hover{background:rgba(242,139,130,.25)}
.btn-accent{background:rgba(138,180,248,.15);color:var(--accent)}
.btn-accent:hover{background:rgba(138,180,248,.25)}
.about-card{display:flex;align-items:center;gap:14px;padding:16px;background:var(--c-omni);border-radius:var(--radius);margin-bottom:16px}
.about-card img{width:48px;height:48px;border-radius:var(--radius)}
.about-card .name{font-size:16px;font-weight:500}
.about-card .ver{font-size:12px;color:var(--c-text2);margin-top:2px}
.side-panel{position:fixed;top:0;right:0;width:0;height:100%;background:var(--c-bg);border-left:1px solid var(--c-border);z-index:50;transition:width .25s ease;overflow:hidden;display:flex;flex-direction:column}
.side-panel.open{width:340px}
.sp-header{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--c-border);flex-shrink:0}
.sp-header h3{flex:1;font-size:14px;font-weight:500}
.sp-close{width:26px;height:26px;border:none;background:none;color:var(--c-text2);cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
.sp-close:hover{background:var(--c-hover);color:var(--c-text)}
.sp-tabs{display:flex;border-bottom:1px solid var(--c-border);flex-shrink:0}
.sp-tab{flex:1;padding:8px 6px;font-size:10px;text-align:center;color:var(--c-text2);cursor:pointer;border-bottom:2px solid transparent;text-transform:uppercase;letter-spacing:.5px;font-weight:600;transition:color .15s,border-color .15s}
.sp-tab:hover{color:var(--c-text)}
.sp-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.sp-body{flex:1;overflow-y:auto;padding:6px}
.sp-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:background .12s}
.sp-item:hover{background:var(--c-hover)}
.sp-item .sp-title{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-item .sp-url{font-size:10px;color:var(--c-text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-empty{text-align:center;color:var(--c-text2);padding:32px;font-size:12px}
.ctx-menu{position:fixed;z-index:10000;background:var(--c-bg);border:1px solid var(--c-border);border-radius:var(--radius);padding:4px 0;min-width:200px;box-shadow:0 8px 32px rgba(0,0,0,.45);display:none;font-size:13px;color:var(--c-text)}
.ctx-menu.visible{display:block}
.ctx-menu .item{padding:6px 14px;cursor:pointer;transition:background .08s;border-radius:4px;margin:0 4px}
.ctx-menu .item:hover{background:var(--c-hover)}
.ctx-menu .div{height:1px;background:var(--c-border);margin:4px 0}
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center}
.modal-overlay.visible{display:flex}
.modal-box{background:var(--c-bg);border:1px solid var(--c-border);border-radius:var(--radius);width:90%;max-width:480px;padding:24px;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,.4)}
#zoomTip{position:fixed;bottom:48px;left:50%;transform:translateX(-50%);background:var(--c-bg);border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:6px 16px;font-size:13px;z-index:9999;transition:opacity .25s;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.3);opacity:0}
#toast{position:fixed;bottom:56px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--c-bg);border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:9px 18px;font-size:13px;color:var(--c-text);z-index:10000;transition:opacity .2s,transform .2s;opacity:0;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.35);max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.radar-panel{position:fixed;right:14px;top:64px;width:300px;max-height:70vh;background:var(--c-bg);border:1px solid var(--c-border);border-radius:var(--radius);z-index:120;display:none;flex-direction:column;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.45)}
.radar-panel.visible{display:flex}
.radar-header{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--c-border);flex-shrink:0}
.radar-header .t{flex:1;font-size:13px;font-weight:600}
.radar-close{width:24px;height:24px;border:none;background:none;color:var(--c-text2);cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center}
.radar-close:hover{background:var(--c-hover);color:var(--c-text)}
.radar-close svg{width:12px;height:12px}
.radar-score-wrap{display:flex;align-items:center;gap:12px;padding:14px 12px;border-bottom:1px solid var(--c-border)}
.radar-gauge{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;background:conic-gradient(var(--accent) 0deg,rgba(255,255,255,.06) 0deg);flex-shrink:0}
.radar-gauge .in{width:48px;height:48px;border-radius:50%;background:var(--c-bg);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700}
.radar-meta{flex:1;font-size:12px;color:var(--c-text2);line-height:1.6}
.radar-meta b{color:var(--c-text)}
.radar-body{flex:1;overflow-y:auto;padding:6px}
.radar-empty{text-align:center;color:var(--c-text2);padding:24px 12px;font-size:12px}
.radar-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:var(--radius-sm);font-size:12px}
.radar-item:hover{background:var(--c-hover)}
.radar-dom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.radar-nums{font-size:11px;color:var(--c-text2);flex-shrink:0}
.radar-nums.c{color:#f28b82}
.radar-pulse{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:#4caf50;box-shadow:0 0 8px #4caf50;animation:radarBlink 1.2s ease-in-out infinite}
@keyframes radarBlink{0%,100%{opacity:1}50%{opacity:.25}}
</style>
</head>
<body>
<div class="app">
<div class="titlebar">
  <div class="drag-strip"></div>
  <button class="new-tab-btn" id="new-tab-btn" title="New tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14m-7-7h14"/></svg></button>
  <div class="tab-strip" id="tab-strip">
    <div id="tab-list"></div>
  </div>
  <div class="win-ctrls">
    <button class="win-btn" data-act="min"><svg viewBox="0 0 12 12"><rect x="1" y="5.5" width="10" height="1" fill="currentColor"/></svg></button>
    <button class="win-btn" data-act="max"><svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1"/></svg></button>
    <button class="win-btn wc-close" data-act="close"><svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.2"/></svg></button>
  </div>
</div>
<div class="toolbar">
  <button class="tb-btn" id="btn-back" disabled title="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5m7-7l-7 7 7 7"/></svg></button>
  <button class="tb-btn" id="btn-fwd" disabled title="Forward"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14m-7-7l7 7-7 7"/></svg></button>

      function applyTheme(theme){
        if(!theme)return;
        var all=darkThemes.concat(lightThemes);var t=typeof theme==="number"?all[theme]:null;

    }else if(id==="accessibility"){
      bindChange("s-a11yfont",function(v){document.documentElement.style.fontSize=v+"px";});

function bindChange(id,cb){var el=$(id);if(el)el.addEventListener("change",function(e){cb(e.target.value);});}
function bindSidePanel(){
  $("btn-side").addEventListener("click",function(){var sp=$("side-panel");sp.classList.toggle("open");if(sp.classList.contains("open"))renderSidePanel("bookmarks");});

function openSideTab(type){
  var sp=$("side-panel");sp.classList.add("open");

function toggleBookmarkBar(){
  var bar=$("bm-bar");if(!bar)return;
  bar.classList.toggle("visible");
  if(!bar.classList.contains("visible")&&bar.classList.contains("manual"))bar.classList.remove("manual");
  else bar.classList.add("manual");

async function renderSidePanel(type){
  var body=$("sp-body");
  var items=[];
  if(type==="bookmarks"&&api&&api.getBookmarks)items=await api.getBookmarks().catch(function(){return[];});
  else if(type==="history"&&api&&api.getHistory)items=await api.getHistory().catch(function(){return[];});
  else if(type==="downloads")items=agDownloads;
  if(!items||!items.length){body.innerHTML="<div class=\"sp-empty\">No items</div>";return;}
  body.innerHTML=items.map(function(i){return "<div class=\"sp-item\" data-url=\""+esc(i.url||"")+"\"><div style=\"flex:1;overflow:hidden\"><div class=\"sp-title\">"+esc(i.title||i.filename||i.name||"Untitled")+"</div><div class=\"sp-url\">"+esc(i.url||"")+"</div></div></div>";}).join("");
  body.querySelectorAll(".sp-item").forEach(function(el){el.addEventListener("click",function(){var u=el.dataset.url;if(u)addTab(u);});});
}
function bindAnterGet(){
  var start=$("ag-start");if(start)start.addEventListener("click",function(){var u=$("ag-url").value.trim();if(u){startAGDownload(u);$("ag-url").value="";}});
  var agInp=$("ag-url");if(agInp)agInp.addEventListener("keydown",function(e){if(e.key==="Enter"){var u=agInp.value.trim();if(u){startAGDownload(u);agInp.value="";}}});
}
function openAgPanel(){addTab("about:anterget");}
function startAGDownload(url){
  var id=Date.now();var name=url.split("/").pop().split("?")[0]||"download";
  var item={id:id,name:name,url:url,status:"queued",progress:0,size:0,speed:0};
  agDownloads.push(item);agIdMap[id]=item;renderAG();
  if(api&&api.agStart){api.agStart(url).then(function(rid){agIdMap[rid]=item;item.realId=rid;renderAG();}).catch(function(){});}
}
function handleAgUpdate(d){
  var item=agIdMap[d.id];if(!item)return;
  item.name=d.filename||item.name;item.size=d.total||0;item.received=d.received||0;item.speed=d.speed||0;
  item.status=d.state||"downloading";item.progress=item.size>0?Math.round((item.received/item.size)*100):0;
  if(item.status==="done")item.progress=100;renderAG();
}
function renderAG(){
  var body=$("ag-body");if(!body)return;
  if(!agDownloads.length){body.innerHTML="<div style=\"text-align:center;color:var(--c-text2);padding:40px 0\">No downloads yet</div>";return;}
  body.innerHTML=agDownloads.map(function(d){
    var st=d.status==="done"?"done":d.status==="paused"?"paused":d.status==="error"?"error":"dl";
    var btns=(d.status==="downloading"||d.status==="queued")?"Pause Stop":d.status==="paused"?"Resume Stop":"Clear";
    return "<div style=\"background:var(--c-omni);border-radius:8px;padding:12px;margin-bottom:8px\"><div style=\"font-weight:500;font-size:13px;margin-bottom:4px\">"+esc(d.name)+"</div><div style=\"height:4px;border-radius:2px;background:var(--c-border);margin-bottom:8px\"><div style=\"height:100%;border-radius:2px;background:var(--accent);width:"+d.progress+"%\"></div></div><div style=\"display:flex;justify-content:space-between;font-size:11px;color:var(--c-text2)\"><span>"+d.status+"</span><span>"+d.progress+"%"+(d.size?" "+fmtSize(d.size):"")+"</span></div></div>";
  }).join("");
}
function fmtSize(b){if(!b)return"";if(b<1024)return b+" B";if(b<1048576)return(b/1024).toFixed(1)+" KB";if(b<1073741824)return(b/1048576).toFixed(1)+" MB";return(b/1073741824).toFixed(2)+" GB";}

  try{$("btn-back").addEventListener("click",goBack);$("btn-fwd").addEventListener("click",goForward);$("btn-reload").addEventListener("click",reloadPage);$("btn-home").addEventListener("click",goHome);}catch(e){}

  try{$("btn-pip").addEventListener("click",togglePip);$("btn-reader").addEventListener("click",toggleReader);$("btn-split").addEventListener("click",toggleSplit);$("btn-radar").addEventListener("click",toggleRadar);}catch(e){}
  try{$("radar-close").addEventListener("click",function(){if(radarOpen)toggleRadar();});}catch(e){}
  try{initClock();loadTopSites();bindNTPSearch();}catch(e){err("ntp",e);}
  if(api){
    try{if(api.onOpenNewTab)api.onOpenNewTab(function(url){addTab(url);});}catch(e){}
    try{if(api.onSaveSessionNow)api.onSaveSessionNow(function(){saveSession();});}catch(e){}
    try{if(api.onShowDownloadModal)api.onShowDownloadModal(function(d){var url=typeof d==="string"?d:(d&&d.url)||"";showDownloadBlockModal(url);});}catch(e){}
    try{if(api.onAgUpdate)api.onAgUpdate(handleAgUpdate);}catch(e){}
    try{if(api.onRadarUpdate)api.onRadarUpdate(onRadarUpdate);}catch(e){}
  }
  log("init done, calling loadSavedSession");
  loadSavedSession();
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",init);}else{init();}
})();
</script>
</body>
</html>
